_structures:
  hoursRows:
    values:
      - label: Hours Row
        icon: schedule
        value:
          label: Monday – Friday
          dayStart: "1"
          dayEnd: "5"
          open: "08:00"
          close: "20:00"
        preview:
          text:
            - key: label
            - Hours Row
          subtext:
            - key: open
        _inputs:
          label:
            type: text
            comment: Day range label displayed in the hours table (e.g. "Monday – Saturday").
          dayStart:
            type: select
            comment: First day of this range (used to calculate the live status badge).
            options:
              values:
                - id: "0"
                  name: Sunday
                - id: "1"
                  name: Monday
                - id: "2"
                  name: Tuesday
                - id: "3"
                  name: Wednesday
                - id: "4"
                  name: Thursday
                - id: "5"
                  name: Friday
                - id: "6"
                  name: Saturday
          dayEnd:
            type: select
            comment: Last day of this range (inclusive).
            options:
              values:
                - id: "0"
                  name: Sunday
                - id: "1"
                  name: Monday
                - id: "2"
                  name: Tuesday
                - id: "3"
                  name: Wednesday
                - id: "4"
                  name: Thursday
                - id: "5"
                  name: Friday
                - id: "6"
                  name: Saturday
          open:
            type: text
            comment: Opening time in 24-hour format (e.g. "08:00", "11:30").
          close:
            type: text
            comment: Closing time in 24-hour format (e.g. "20:00", "21:30").

  buttonItems:
    values:
      - label: Button
        icon: link
        value:
          text: Button label
          href: ""
          style: dark
          external: false
        preview:
          text:
            - key: text
            - Button
          subtext:
            - key: href
        _inputs:
          text:
            type: text
            comment: Button label.
          href:
            type: url
            comment: Button destination URL.
          style:
            type: select
            comment: Button visual style.
            options:
              values:
                - id: dark
                  name: Dark
                - id: outline
                  name: Outline
                - id: light
                  name: Light
                - id: white
                  name: White
                - id: ghost
                  name: Ghost
          external:
            type: switch
            comment: Open link in a new tab.
